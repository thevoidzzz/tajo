name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: tajo
          POSTGRES_DB: tajo
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U tajo"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install the API
        run: npm ci
      - name: Test the API
        run: npm test
        env:
          DATABASE_URL: postgresql://tajo@127.0.0.1:5435/tajo
      - name: Install the page
        working-directory: web
        run: npm ci
      - name: Test the page
        working-directory: web
        run: npm test
